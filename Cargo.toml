[package]
name = "ip-config-tool"
version = "0.1.0"
edition = "2021"
description = "Scan, auto-detect, apply and revert Windows network adapter IP configuration."

[lib]
name = "ip_config_tool"
path = "src/lib.rs"

[[bin]]
name = "ip-config-tool"
path = "src/main.rs"
test = false

[dependencies]
dns-lookup = "4.0.1"
native-windows-derive = "1.0.5"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
winapi = { version = "0.3.9", features = ["iphlpapi", "minwindef"] }

[dependencies.native-windows-gui]
version = "1.0.13"
default-features = false
features = ["combobox", "list-view", "timer", "notice", "clipboard", "embed-resource"]

[build-dependencies]
embed-manifest = "1.5.0"
winres = "0.1.12"

[profile.release]
opt-level = "z"
# Fat LTO (lto = true) was found to silently over-eliminate reachable code
# in a clean build with this dependency set (native-windows-derive's
# generated App::build_ui and everything it calls disappeared entirely —
# confirmed via string search on the compiled exe, not just a hunch).
# Keep this off; a ~1.7MB exe is still trivially "small" without it.
lto = false
strip = true
panic = "abort"

[dev-dependencies]
serial_test = "4.0.1"
