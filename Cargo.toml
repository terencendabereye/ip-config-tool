[package]
name = "ip-config-tool"
version = "0.1.0"
edition = "2021"
description = "Scan, auto-detect, apply and revert Windows network adapter IP configuration."

[lib]
name = "ip_config_tool"
path = "src/lib.rs"

[[bin]]
name = "ip-config-tool"
path = "src/main.rs"
test = false

[dependencies]
dns-lookup = "4.0.1"
native-windows-derive = "1.0.5"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
winapi = { version = "0.3.9", features = ["iphlpapi", "minwindef"] }

[dependencies.native-windows-gui]
version = "1.0.13"
default-features = false
features = ["combobox", "list-view", "timer", "notice", "clipboard"]

[build-dependencies]
embed-manifest = "1.5.0"

[profile.release]
opt-level = "z"
lto = true
strip = true
panic = "abort"

[dev-dependencies]
serial_test = "4.0.1"
